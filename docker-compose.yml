services:
  db:
    image: postgres:15-alpine
    enviroment:
       POSTGRES_USER: nimc_user
       POSTGRES_PASSWORD: nimc_password
       POSTGRES_DB: nimc_db
    volumes:
      - ./database/db-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    enviroment:
      POSTGRES_USER: nimc_user
      POSTGRES_PASSWORD: nimc_password
    ports:
      - "5000:5000"
    depends_on:
      - db 
  frontend:
    build: ./frontend
    ports:
      - "4000:3000"
    enviroment:
      REACT_APP_API_URL: http://backend:5000
    depends_on:
      - backend    


